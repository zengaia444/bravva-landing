<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Add a past city · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}input,textarea{font-family:inherit}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; box-sizing: border-box; padding: 52px 24px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="passport.html" aria-label="Back to your Passport" style="text-decoration: none; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F6EEE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Add a past city</div>
<div style="width: 44px"></div>
</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.1">Been there? <span style="font-family: 'Parisienne', cursive; font-weight: 400; font-size: 1.2em; color: #F0C9D3">Pin the memory.</span></h1>
<div style="background: #4A1640; border: 1px solid #6A2A5C; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #E3CDD3">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="1.6" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="6"/></svg>
<span>Past cities show as outline pins on your Passport. Cities don't earn Sparkles, but vetting a café, stay or experience you loved there earns +20 each.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="city-search" style="font-size: 14px; font-weight: 700">Search a city</label>
<input id="city-search" type="text" autocomplete="off" placeholder="e.g. Paris" onInput="{{ onType }}" style="box-sizing: border-box; width: 100%; height: 48px; border-radius: 14px; border: 1px solid #7A3A6C; background: #4A1640; padding: 0 14px; font-size: 16px; color: #F6EEE2">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ results }}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #6A2A5C">
<div style="display: flex; flex-direction: column; gap: 1px"><div style="font-size: 15px; font-weight: 700">{{ r.name }}</div><div style="font-size: 12px; color: #E3CDD3">{{ r.country }}</div></div>
<button type="button" onClick="{{ r.add }}" aria-label="{{ r.aria }}" style="border: 0; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{ r.bg }}; color: #F6EEE2">{{ r.label }}</button>
</div>
</sc-for>
</div>
<sc-if value="{{ hasAdded }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Added just now</div>
<sc-for list="{{ added }}" as="a" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 10px; background: #561E4A; border-radius: 14px; padding: 8px 12px">
<svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#F0C9D3" stroke-width="1.6"/></svg>
<div style="flex-grow: 1; font-size: 14px"><b>{{ a.name }}</b> <span style="color: #E3CDD3">· past trip · no Sparkles</span></div>
<a href="{{ a.placesHref }}" style="font-size: 12px; font-weight: 700; color: #F0C9D3; white-space: nowrap">+ Places</a>
<button type="button" onClick="{{ a.remove }}" aria-label="{{ a.aria }}" style="border: 0; cursor: pointer; background: transparent; color: #E3CDD3; font-size: 18px; width: 32px; height: 32px">×</button>
</div>
</sc-for>
</div>
</sc-if>
<a href="passport.html" style="margin-top: auto; text-decoration: none; background: #B0246E; color: #F6EEE2; font-weight: 700; font-size: 17px; height: 52px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center">Done</a>
</div>
<nav aria-label="Main" style="height: 84px; flex-shrink: 0; box-sizing: border-box; background: #4A1640; border-top: 1px solid #6A2A5C; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
<a href="home.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
<a href="nearby.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4"/></svg>Nearby</a>
<a href="places.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Places</a>
<a href="trips.html" aria-current="page" style="text-decoration: none; color: #F0C9D3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/></svg>Trips</a>
</nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { q: '', added: [] }; }
renderVals() {
const s = this.state;
const pool = [['Paris','France'],['Rome','Italy'],['Tokyo','Japan'],['New York','United States'],['Lisbon','Portugal'],['Seoul','South Korea'],['Hanoi','Vietnam'],['Singapore','Singapore'],['Kyoto','Japan'],['Istanbul','Turkey'],['Marrakech','Morocco'],['Buenos Aires','Argentina'],['Sydney','Australia'],['Prague','Czechia'],['Berlin','Germany'],['Amsterdam','Netherlands'],['Taipei','Taiwan'],['Dubai','United Arab Emirates'],['Lima','Peru'],['Hong Kong','China']];
const onPassport = ['Paris','Rome','Tokyo','New York','Lisbon','Porto','Seville','Barcelona','Bangkok','Chiang Mai','Manila','Mexico City','Medellín','Cape Town','Tbilisi'];
const q = s.q.trim().toLowerCase();
const hits = pool.filter(([n, c]) => !q || n.toLowerCase().startsWith(q) || c.toLowerCase().startsWith(q)).slice(0, 4);
const results = hits.map(([n, c]) => {
const has = onPassport.indexOf(n) > -1 || s.added.indexOf(n) > -1;
return { name: n, country: c, label: has ? 'On your Passport' : '+ Add', bg: has ? '#6A2A5C' : '#B0246E', aria: has ? n + ' is already on your Passport' : 'Add ' + n + ' as a past trip',
add: () => { if (!has) this.setState({ added: s.added.concat([n]) }); } };
});
const added = s.added.map((n) => ({ name: n, placesHref: 'add-place.html?city=' + encodeURIComponent(n), aria: 'Remove ' + n, remove: () => this.setState({ added: s.added.filter((x) => x !== n) }) }));
return { results, added, hasAdded: added.length > 0, onType: (e) => this.setState({ q: e.target.value }) };
}
}
dcMount(Component);
</script>
</body>
</html>
