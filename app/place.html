<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Place · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}input,textarea{font-family:inherit}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; box-sizing: border-box; padding: 52px 24px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="places.html" aria-label="Back to places" style="text-decoration: none; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F6EEE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Café · Príncipe Real</div>
<button type="button" aria-label="Report this place" style="border: 0; background: transparent; cursor: pointer; width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg></button>
</div>
<div role="img" aria-label="Photo placeholder: the café's vibe" style="height: 150px; flex-shrink: 0; border-radius: 22px; background: #6A2A5C; color: #F0C9D3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Photo: the café's vibe</div></div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.1">[Café name]</h1>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="background: #F0C9D3; color: #3B1030; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">Member-vetted</span><span style="background: #561E4A; font-size: 12px; padding: 4px 10px; border-radius: 999px">Fast wifi</span><span style="background: #561E4A; font-size: 12px; padding: 4px 10px; border-radius: 999px">Solo-friendly</span></div>
</div>
<button type="button" onClick="{{ vouch }}" aria-pressed="{{ vouchedAria }}" style="flex-shrink: 0; border: 0; cursor: pointer; min-width: 76px; height: 64px; border-radius: 18px; background: {{ vouchBg }}; color: {{ vouchFg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{ starFill }}" stroke="{{ vouchFg }}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
<span style="font-size: 13px; font-weight: 700">{{ vouchCount }} vets</span>
</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #E3CDD3">
<div style="width: 22px; height: 22px; border-radius: 50%; background: #E6D8C5"></div>Pinned this month by Maya
</div>
<div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #6A2A5C; padding-top: 12px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Questions and notes</div>
<sc-for list="{{ comments }}" as="m" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start">
<div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: {{ m.color }}; color: #3B1030; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">{{ m.initial }}</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px"><b>{{ m.name }}</b> <span style="font-size: 12px; color: #F0C9D3">{{ m.badge }}</span></div>
<div style="font-size: 14px; line-height: 1.4; color: #E3CDD3">{{ m.text }}</div>
</div>
</div>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; gap: 8px">
<label for="comment" style="position: absolute; left: -9999px">Ask or add a note</label>
<input id="comment" type="text" placeholder="Ask or add a note" style="flex-grow: 1; min-width: 0; box-sizing: border-box; height: 46px; border-radius: 999px; border: 1px solid #7A3A6C; background: #4A1640; padding: 0 16px; font-size: 15px; color: #F6EEE2">
<button type="button" onClick="{{ post }}" style="border: 0; cursor: pointer; background: #B0246E; color: #F6EEE2; font-weight: 700; font-size: 15px; height: 46px; padding: 0 18px; border-radius: 999px">Post</button>
</div>
</div>
<nav aria-label="Main" style="height: 84px; flex-shrink: 0; box-sizing: border-box; background: #4A1640; border-top: 1px solid #6A2A5C; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
<a href="home.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
<a href="nearby.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4"/></svg>Nearby</a>
<a href="places.html" aria-current="page" style="text-decoration: none; color: #F0C9D3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Places</a>
<a href="trips.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/></svg>Trips</a>
</nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { vouched: false, mine: [] }; }
renderVals() {
const s = this.state;
const base = [
{ name: 'Joana Ferreira', badge: 'Friend', color: '#E6D8C5', initial: 'J', text: 'Best flat white in the area. Quiet upstairs until 11.' },
{ name: 'Priya', badge: '', color: '#F0C9D3', initial: 'P', text: 'Is it OK to work there for 3+ hours?' },
{ name: 'Lena', badge: '2 mutuals', color: '#B0246E', initial: 'L', text: 'Yes, staff are lovely about it. Plugs by the window.' }
];
const comments = base.concat(s.mine).slice(-3);
return {
comments,
vouchedAria: s.vouched ? 'true' : 'false',
vouchBg: s.vouched ? '#F0C9D3' : '#561E4A', vouchFg: s.vouched ? '#3B1030' : '#F6EEE2', starFill: s.vouched ? '#3B1030' : 'none',
vouchCount: s.vouched ? 10 : 9,
vouch: () => this.setState({ vouched: !s.vouched }),
post: () => { const i = document.getElementById('comment'); const v = i && i.value.trim(); if (!v) return; i.value = ''; this.setState({ mine: s.mine.concat([{ name: 'You', badge: '', color: '#F0C9D3', initial: 'Y', text: v }]) }); }
};
}
}
dcMount(Component);
</script>
</body>
</html>
