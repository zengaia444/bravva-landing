<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Safety circle · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}input,textarea{font-family:inherit}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">
<div style="flex-grow: 1; box-sizing: border-box; padding: 52px 24px 12px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="home.html" aria-label="Back to home" style="text-decoration: none; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F6EEE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Safety circle</div>
<div style="width: 44px"></div>
</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.08">Your circle <span style="font-family: 'Parisienne', cursive; font-weight: 400; font-size: 1.2em; color: #F0C9D3">has your back.</span></h1>
<div role="group" aria-label="Prototype view" style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #E3CDD3">Prototype view:
<button type="button" onClick="{{ setFree }}" aria-pressed="{{ freeAria }}" style="border: 0; cursor: pointer; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{ freeBg }}; color: #F6EEE2">Free</button>
<button type="button" onClick="{{ setPaid }}" aria-pressed="{{ paidAria }}" style="border: 0; cursor: pointer; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{ paidBg }}; color: #F6EEE2">Paid</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ friends }}" as="f" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; background: #561E4A; border-radius: 18px; padding: 10px 14px">
<div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: {{ f.color }}; color: #3B1030; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ f.initial }}</div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">{{ f.name }}</div><div style="font-size: 13px; color: #E3CDD3">{{ f.meta }}</div></div>
</div>
</sc-for>
</div>
<div style="font-size: 13px; color: #E3CDD3">{{ capacity }}</div>
<button type="button" onClick="{{ addFriend }}" style="cursor: pointer; height: 48px; flex-shrink: 0; border-radius: 999px; border: 2px solid #F0C9D3; background: transparent; color: #F0C9D3; font-weight: 700; font-size: 15px">+ Add a friend to your circle</button>
<div style="margin-top: auto; background: #4A1640; border: 1px solid #6A2A5C; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F0C9D3" aria-hidden="true"><path d="M11 2.5l2.1 6.1 6.1 2.1-6.1 2.1L11 18.9l-2.1-6.1L2.8 10.7l6.1-2.1z"/><path d="M18.5 14.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg><div style="font-size: 16px; font-weight: 700">Refer a friend</div></div>
<div style="font-size: 13px; line-height: 1.45; color: #E3CDD3">You both earn +50 Sparkles when she verifies her email and checks in 3 times, and +150 more each when she becomes a paying member.</div>
<div style="display: flex; gap: 8px; align-items: center">
<div style="flex-grow: 1; min-width: 0; height: 40px; border-radius: 12px; background: #3B1030; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #E3CDD3; overflow: hidden; white-space: nowrap">bravvaclub.com/invite/[your-code]</div>
<button type="button" onClick="{{ copy }}" style="border: 0; cursor: pointer; height: 40px; padding: 0 14px; border-radius: 12px; background: #B0246E; color: #F6EEE2; font-weight: 700; font-size: 13px">{{ copyLabel }}</button>
</div>
</div>
</div>
<nav aria-label="Main" style="height: 84px; flex-shrink: 0; box-sizing: border-box; background: #4A1640; border-top: 1px solid #6A2A5C; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
<a href="home.html" aria-current="page" style="text-decoration: none; color: #F0C9D3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
<a href="nearby.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4"/></svg>Nearby</a>
<a href="places.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Places</a>
<a href="trips.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/></svg>Trips</a>
</nav>
<sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(42, 11, 34, 0.72); display: flex; align-items: flex-end">
<div role="dialog" aria-label="Upgrade to add more friends" style="width: 100%; box-sizing: border-box; background: #561E4A; border-radius: 28px 28px 0 0; padding: 28px 24px 36px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.15">Free includes 1 circle friend.</div>
<div style="font-size: 15px; line-height: 1.5; color: #E3CDD3">Upgrade to add as many friends as you like. Monthly starts with 30 free days.</div>
<a href="https://join.bravvaclub.com" style="text-decoration: none; background: #B0246E; color: #F6EEE2; font-weight: 700; font-size: 16px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center">Join Now</a>
<a href="plans.html" style="text-decoration: none; border: 2px solid #F6EEE2; box-sizing: border-box; color: #F6EEE2; font-weight: 700; font-size: 16px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center">See what's included</a>
<button type="button" onClick="{{ closeSheet }}" style="border: 0; cursor: pointer; background: transparent; color: #E3CDD3; font-size: 15px; height: 44px">Not now</button>
</div>
</div>
</sc-if>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { plan: 'free', count: 1, sheet: false, copied: false }; }
renderVals() {
const s = this.state;
const pool = [
{ name: 'Ana', meta: 'Last check-in 8:12 am · all good', color: '#F0C9D3' },
{ name: 'Maya', meta: 'Added today', color: '#E6D8C5' },
{ name: 'Joana', meta: 'Added today', color: '#F6EEE2' }
];
const n = s.plan === 'free' ? 1 : s.count;
const friends = pool.slice(0, n).map((f) => Object.assign({ initial: f.name.charAt(0) }, f));
const free = s.plan === 'free';
return {
friends,
capacity: free ? '1 of 1 circle spots used on Free' : 'Paid plan: add as many friends as you like',
freeAria: free ? 'true' : 'false', paidAria: free ? 'false' : 'true',
freeBg: free ? '#B0246E' : '#561E4A', paidBg: free ? '#561E4A' : '#B0246E',
setFree: () => this.setState({ plan: 'free', sheet: false }),
setPaid: () => this.setState({ plan: 'paid', count: Math.max(s.count, 1) }),
addFriend: () => { if (free) { this.setState({ sheet: true }); } else { this.setState({ count: Math.min(s.count + 1, pool.length) }); } },
sheet: s.sheet,
closeSheet: () => this.setState({ sheet: false }),
copyLabel: s.copied ? 'Copied' : 'Copy link',
copy: () => this.setState({ copied: true })
};
}
}
dcMount(Component);
</script>
</body>
</html>
