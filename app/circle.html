<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Safety circle · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}input,textarea{font-family:inherit}input::placeholder{color:#B57AA6}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
<script src="theme.js"></script>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="flex-grow: 1; box-sizing: border-box; padding: 52px 24px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="home.html" aria-label="Back to home" style="text-decoration: none; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F6EEE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">My circle</div>
<div style="width: 44px"></div>
</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.08">Your circle <span style="font-family: 'Parisienne', cursive; font-weight: 400; font-size: 1.2em; color: #F0C9D3">has your back.</span></h1>
<div style="font-size: 14px; line-height: 1.45; color: #E3CDD3; margin-top: -4px">Up to 5 verified BRAVVA women who get your check-ins, Plan timers and an alert if you go quiet.</div>
<div style="display: flex; align-items: center; gap: 12px; background: #4A1640; border-radius: 18px; padding: 12px 14px">
<div style="display: flex; gap: 6px" aria-hidden="true">
<sc-for list="{{ slots }}" as="d" hint-placeholder-count="5"><span style="width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; background: {{ d.bg }}; border: 2px solid {{ d.bd }}; display: block"></span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 1px"><div style="font-size: 15px; font-weight: 700">{{ usedLabel }}</div><div style="font-size: 12px; color: #E3CDD3">{{ leftLabel }}</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ members }}" as="m" hint-placeholder-count="3">
<a href="circle-member.html" style="text-decoration: none; color: #F6EEE2; display: flex; align-items: center; gap: 12px; background: #561E4A; border-radius: 18px; padding: 10px 14px">
<span style="position: relative; flex-shrink: 0; display: block"><span style="width: 44px; height: 44px; border-radius: 50%; background: {{ m.bg }}; color: #3B1030; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">{{ m.initial }}</span><span style="position: absolute; right: -3px; bottom: -3px"><svg viewBox="0 0 24 24" width="18" height="18" aria-label="Verified member" role="img" style="display: block; flex-shrink: 0"><circle cx="12" cy="12" r="11" fill="#1D9BF0" stroke="#561E4A" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 700">{{ m.name }}</span><span style="font-size: 13px; color: #E3CDD3; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{ m.dot }}; display: block; flex-shrink: 0"></span>{{ m.meta }}</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"/></svg>
</a>
</sc-for>
<sc-for list="{{ pending }}" as="p" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; border: 2px dashed #7A3A6C; border-radius: 18px; padding: 8px 12px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px dashed #B57AA6; box-sizing: border-box; color: #F0C9D3; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ p.initial }}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 700">{{ p.name }}</span><span style="font-size: 13px; color: #E3CDD3">Invited · joins once she's verified</span></span>
<button type="button" onClick="{{ p.resend }}" style="border: 0; cursor: pointer; height: 34px; padding: 0 12px; border-radius: 999px; background: #6A2A5C; color: #F0C9D3; font-weight: 700; font-size: 13px; white-space: nowrap">{{ p.label }}</button>
</div>
</sc-for>
</div>
<sc-if value="{{ hasRoom }}" hint-placeholder-val="{{ true }}">
<a href="circle-add.html" style="text-decoration: none; height: 52px; flex-shrink: 0; border-radius: 999px; background: #B0246E; color: #F6EEE2; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6EEE2" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add to my circle</a>
</sc-if>
<sc-if value="{{ isFull }}" hint-placeholder-val="{{ false }}">
<div style="background: #4A1640; border-radius: 18px; padding: 14px 16px; font-size: 14px; line-height: 1.45; color: #E3CDD3"><strong style="color: #F6EEE2">Your circle is full.</strong> To add someone new, open a member and remove her first.</div>
</sc-if>
<div style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.45; color: #E3CDD3; padding: 4px 2px 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<span>BRAVVA is invite-only and women-only. Only verified members can be in your circle.</span>
</div>
</div>
<nav aria-label="Main" style="height: 84px; flex-shrink: 0; box-sizing: border-box; background: #4A1640; border-top: 1px solid #6A2A5C; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
<a href="home.html" aria-current="page" style="text-decoration: none; color: #F0C9D3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
<a href="nearby.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4"/></svg>Nearby</a>
<a href="places.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Places</a>
<a href="trips.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/></svg>Trips</a>
</nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { resent: false }; }
renderVals() {
const s = this.state;
const slotsFor = (used, pending) => [0,1,2,3,4].map((i) => i < used ? { bg: '#B0246E', bd: '#B0246E' } : i < used + pending ? { bg: 'transparent', bd: '#B0246E' } : { bg: 'transparent', bd: '#7A3A6C' });
const members = [
{ name: 'Minrie', meta: 'Checked in 8:12 am · Makati', dot: '#34C759', photo: 'minrie.jpg' },
{ name: 'Maya', meta: 'Checked in yesterday · Lisbon', dot: '#34C759', color: '#E6D8C5' },
{ name: 'Joana', meta: 'Timer running · Bali', dot: '#FFD21F', color: '#F6EEE2' }
].map((f) => Object.assign({ initial: f.photo ? '' : f.name.charAt(0), bg: f.photo ? 'url(' + f.photo + ') center / cover no-repeat' : f.color }, f));
const pending = [{ name: 'Lea', initial: 'L', label: s.resent ? 'Sent' : 'Resend', resend: () => this.setState({ resent: true }) }];
const used = members.length + pending.length;
return {
members, pending,
slots: slotsFor(members.length, pending.length),
usedLabel: used + ' of 5 spots used',
leftLabel: used >= 5 ? 'Circle full' : (5 - used) + (5 - used === 1 ? ' spot left' : ' spots left') + ' · invites hold a spot',
hasRoom: used < 5, isFull: used >= 5
};
}
}
dcMount(Component);
</script>
</body>
</html>
