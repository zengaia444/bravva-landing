<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Women-vetted places · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; box-sizing: border-box; padding: 56px 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Vetted places · Lisbon</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.06; letter-spacing: -0.02em">Where BRAVVA women <span style="font-family: 'Parisienne', cursive; font-weight: 400; font-size: 1.2em; color: #F0C9D3">feel at home.</span></h1>
<a href="add-place.html" style="align-self: flex-start; text-decoration: none; display: flex; align-items: center; gap: 8px; border: 2px solid #F0C9D3; color: #F0C9D3; font-weight: 700; font-size: 15px; height: 44px; padding: 0 18px; border-radius: 999px"><span aria-hidden="true" style="font-size: 20px; line-height: 1">+</span> Add a place</a>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="border: 0; cursor: pointer; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 700; background: {{ f.bg }}; color: {{ f.fg }}">{{ f.label }}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ places }}" as="p" hint-placeholder-count="3">
<a href="place.html" style="text-decoration: none; color: #F6EEE2; background: #561E4A; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div role="img" aria-label="{{ p.photo }}" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; background: #6A2A5C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 700">{{ p.name }}</div>
<div style="font-size: 13px; color: #E3CDD3">{{ p.meta }}</div>
</div>
</div>
<sc-if value="{{ p.perk }}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; background: {{accent}}; color: #F6EEE2; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px">Member perk</div>
</sc-if>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="2">
<div style="background: #6A2A5C; color: #F6EEE2; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 999px">{{ t.label }}</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #F0C9D3">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
{{ p.recs }}
</div>
</a>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="height: 84px; box-sizing: border-box; background: #4A1640; border-top: 1px solid #6A2A5C; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
<a href="home.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
<a href="nearby.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4"/></svg>Nearby</a>
<a href="places.html" aria-current="page" style="text-decoration: none; color: {{highlight}}; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{highlight}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Places</a>
<a href="trips.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/></svg>Trips</a>
</nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
const accent = this.props.accent ?? '#B0246E';
const s = this.state;
const all = [
{ type: 'stay', name: '[Guesthouse name]', meta: 'Stay · Alfama', perk: true, recs: 'Recommended by 14 members', tags: ['Women-run', '24h reception', 'Well-lit street'] },
{ type: 'cafe', name: '[Café name]', meta: 'Café · Príncipe Real', perk: false, recs: 'Recommended by 9 members', tags: ['Fast wifi', 'Solo-friendly', 'Open late'] },
{ type: 'cowork', name: '[Co-work name]', meta: 'Co-work · Cais do Sodré', perk: true, recs: 'Recommended by 11 members', tags: ['Day pass', 'Women’s events', 'Near metro'] },
{ type: 'stay', name: '[Hostel name]', meta: 'Stay · Bairro Alto', perk: false, recs: 'Recommended by 6 members', tags: ['Female dorms', 'Lockers'] }
];
const fl = [
{ id: 'all', label: 'All' },
{ id: 'stay', label: 'Stays' },
{ id: 'cafe', label: 'Cafés' },
{ id: 'cowork', label: 'Co-work' }
];
const filters = fl.map((f) => ({
label: f.label,
pressed: s.filter === f.id ? 'true' : 'false',
bg: s.filter === f.id ? accent : '#561E4A',
fg: s.filter === f.id ? '#F6EEE2' : '#F6EEE2',
pick: () => this.setState({ filter: f.id })
}));
const places = all
.filter((p) => s.filter === 'all' || p.type === s.filter)
.slice(0, 3)
.map((p) => Object.assign({}, p, { photo: 'Photo placeholder: ' + p.meta, tags: p.tags.map((t) => ({ label: t })) }));
return { accent, highlight: this.props.highlight ?? '#F0C9D3', filters, places };
}
}

dcMount(Component);
</script>
</body>
</html>
