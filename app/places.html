<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Women-vetted places · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; box-sizing: border-box; padding: 56px 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Vetted places · Lisbon</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.06; letter-spacing: -0.02em">Where BRAVVA women <span style="font-family: 'Parisienne', cursive; font-weight: 400; font-size: 1.2em; color: #F0C9D3">feel at home.</span></h1>
<a href="add-place.html" style="align-self: flex-start; text-decoration: none; display: flex; align-items: center; gap: 8px; border: 2px solid #F0C9D3; color: #F0C9D3; font-weight: 700; font-size: 15px; height: 44px; padding: 0 18px; border-radius: 999px"><span aria-hidden="true" style="font-size: 20px; line-height: 1">+</span> Add a place</a>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #E3CDD3"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #E5B544"></span>Gold = BRAVVA Verified partners with exclusive perks. Everything else is vetted by members.</div>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="border: 0; cursor: pointer; min-height: 40px; padding: 0 13px; border-radius: 999px; font-size: 14px; font-weight: 700; background: {{ f.bg }}; color: {{ f.fg }}">{{ f.label }}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ places }}" as="p" hint-placeholder-count="3">
<a href="place.html" style="text-decoration: none; color: #F6EEE2; background: #561E4A; border: 2px solid {{ p.border }}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<div role="img" aria-label="{{ p.photo }}" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #6A2A5C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="font-size: 16px; font-weight: 700">{{ p.name }}</div>
<div style="font-size: 13px; color: #E3CDD3">{{ p.meta }}</div>
</div>
</div>
<sc-if value="{{ p.verified }}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; background: #E5B544; color: #3B1030; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#3B1030" aria-hidden="true"><path d="M11 2.5l2.1 6.1 6.1 2.1-6.1 2.1L11 18.9l-2.1-6.1L2.8 10.7l6.1-2.1z"/></svg>BRAVVA Verified</div>
</sc-if>
<sc-if value="{{ p.member }}" hint-placeholder-val="{{ true }}">
<div aria-label="{{ p.vetsAria }}" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; background: #6A2A5C; border-radius: 12px; padding: 4px 9px"><div style="display: flex; align-items: center; gap: 3px; font-size: 15px; font-weight: 800; color: #F0C9D3"><svg width="13" height="13" viewBox="0 0 24 24" fill="#F0C9D3" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>{{ p.vets }}</div><div style="font-size: 10px; color: #E3CDD3">vets</div></div>
</sc-if>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="2">
<div style="background: #6A2A5C; color: #F6EEE2; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px">{{ t.label }}</div>
</sc-for>
</div>
<sc-if value="{{ p.verified }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #E5B544"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E5B544" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-1.5-3-5-3.5-5-1s3 1 5 1c2 0 5 1.5 5-1s-3.5-2-5 1z"/></svg>BRAVVA perk: {{ p.perk }}</div>
</sc-if>
</a>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="height: 84px; box-sizing: border-box; background: #4A1640; border-top: 1px solid #6A2A5C; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
<a href="home.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
<a href="nearby.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.2c.6-.2 1.3-.3 2-.3 2.2 0 4 1.8 4 4"/></svg>Nearby</a>
<a href="places.html" aria-current="page" style="text-decoration: none; color: {{highlight}}; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{highlight}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>Places</a>
<a href="trips.html" style="text-decoration: none; color: #E3CDD3; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E3CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/></svg>Trips</a>
</nav>
</div>
</template>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
const accent = this.props.accent ?? '#B0246E';
const highlight = this.props.highlight ?? '#F0C9D3';
const s = this.state;
const all = [
{ type: 'stay', name: '[Guesthouse name]', meta: 'Stay · Alfama', verified: true, perk: '[10% off your stay]', tags: ['Women-run', '24h reception', 'Well-lit street'] },
{ type: 'cowork', name: '[Co-work name]', meta: 'Co-work · Cais do Sodré', verified: true, perk: '[Free day pass, first visit]', tags: ['Day pass', 'Women’s events'] },
{ type: 'cafe', name: '[Rooftop café name]', meta: 'Café · Graça', vets: 14, tags: ['Sunset views', 'Solo-friendly'] },
{ type: 'exp', name: '[Sunset sail]', meta: 'Experience · Belém', vets: 11, tags: ['Small group', 'Women guides'] },
{ type: 'cafe', name: '[Café name]', meta: 'Café · Príncipe Real', vets: 9, tags: ['Fast wifi', 'Open late'] },
{ type: 'stay', name: '[Hostel name]', meta: 'Stay · Bairro Alto', vets: 6, tags: ['Female dorms', 'Lockers'] }
];
const fl = [['all','All'],['stay','Stays'],['cafe','Cafés'],['cowork','Co-work'],['exp','Experiences']];
const filters = fl.map(([id, label]) => ({ label, pressed: s.filter === id ? 'true' : 'false', bg: s.filter === id ? accent : '#561E4A', fg: '#F6EEE2', pick: () => this.setState({ filter: id }) }));
const places = all
.filter((p) => s.filter === 'all' || p.type === s.filter)
.sort((a, b) => (b.verified ? 1 : 0) - (a.verified ? 1 : 0) || (b.vets || 0) - (a.vets || 0))
.slice(0, 3)
.map((p) => Object.assign({}, p, {
verified: !!p.verified, member: !p.verified,
border: p.verified ? '#E5B544' : 'transparent',
vetsAria: (p.vets || 0) + ' member vets',
photo: 'Photo placeholder: ' + p.meta,
tags: p.tags.map((t) => ({ label: t }))
}));
return { accent, highlight, filters, places };
}
}
dcMount(Component);
</script>
</body>
</html>
