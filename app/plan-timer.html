<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan timer · BRAVVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Parisienne&display=swap" rel="stylesheet">
<style>body{margin:0;background:#2A0B22}a{color:#F6EEE2}a:hover{color:#FFFFFF}button{font-family:inherit}*{-webkit-tap-highlight-color:transparent}.phone{display:flex;justify-content:center;padding:24px 0}@media (max-width:430px){.phone{padding:0}.phone>div{width:100vw!important;height:100dvh!important;min-height:844px}}</style>
</head>
<body>
<div class="phone" id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #3B1030; color: #F6EEE2; font-family: 'DM Sans', system-ui, sans-serif; padding: 56px 28px 40px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="home.html" aria-label="Back to home" style="text-decoration: none; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F6EEE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F0C9D3">Plan timer</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 36px; line-height: 1.06; letter-spacing: -0.02em">Heading out? We'll wait up.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #E3CDD3">Set when you'll be back. If you don't tap in, Ana gets a nudge with your plan and last check-in.</p>
</div>

<sc-if value="{{ isSetup }}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; margin-top: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 700">What's the plan?</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ plans }}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{ p.pick }}" aria-pressed="{{ p.pressed }}" style="border: 0; cursor: pointer; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 700; background: {{ p.bg }}; color: {{ p.fg }}">{{ p.label }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 700">Back by</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ times }}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="border: 0; cursor: pointer; height: 52px; border-radius: 16px; font-size: 16px; font-weight: 700; background: {{ t.bg }}; color: {{ t.fg }}">{{ t.label }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="plan-note" style="font-size: 15px; font-weight: 700">Where and who <span style="font-weight: 400; color: #E3CDD3">(optional)</span></label>
<input id="plan-note" type="text" placeholder="Dinner in Bairro Alto with Tom" style="box-sizing: border-box; width: 100%; height: 52px; border-radius: 16px; border: 1px solid #7A3A6C; background: #4A1640; padding: 0 16px; font-size: 16px; font-family: 'DM Sans', system-ui, sans-serif; color: #F6EEE2">
</div>
<button type="button" onClick="{{ start }}" style="margin-top: auto; border: 0; cursor: pointer; background: {{accent}}; color: #F6EEE2; font-weight: 700; font-size: 17px; height: 56px; border-radius: 999px">Start my timer</button>
</div>
</sc-if>

<sc-if value="{{ isActive }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 24px">
<div style="width: 220px; height: 220px; box-sizing: border-box; border-radius: 50%; border: 10px solid {{highlight}}; background: #4A1640; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 14px; color: #E3CDD3">Back by</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 40px">{{ backBy }}</div>
<div style="font-size: 14px; font-weight: 700; color: #F0C9D3">{{ planLabel }}</div>
</div>
<div style="background: #561E4A; border-radius: 20px; padding: 16px 18px; font-size: 14px; line-height: 1.5; color: #E3CDD3; text-align: center">If you haven't tapped in 15 minutes after, Ana gets a nudge to check on you.</div>
<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{ backSafe }}" style="border: 0; cursor: pointer; background: {{accent}}; color: #F6EEE2; font-weight: 700; font-size: 17px; height: 56px; border-radius: 999px">I'm back safe</button>
<button type="button" onClick="{{ extend }}" style="border: 0; cursor: pointer; background: transparent; color: #F6EEE2; font-weight: 500; font-size: 16px; height: 48px">Add 30 minutes</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
<div style="width: 120px; height: 120px; border-radius: 50%; background: #561E4A; border: 3px solid #F0C9D3; display: flex; align-items: center; justify-content: center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F0C9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 28px">Welcome back.</div>
<div style="font-size: 16px; color: #E3CDD3">Timer closed. Ana won't be nudged.</div>
<div style="background: {{accent}}; color: #F6EEE2; font-weight: 700; font-size: 15px; padding: 8px 16px; border-radius: 999px">+5 Sparkles</div>
<button type="button" onClick="{{ reset }}" style="margin-top: 12px; border: 0; cursor: pointer; background: transparent; color: #F6EEE2; font-weight: 500; font-size: 16px; height: 48px; text-decoration: underline">Start another plan</button>
</div>
</sc-if>
</div>
</template>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'setup', plan: 'date', hours: 2, extra: 0 };
}
renderVals() {
const accent = this.props.accent ?? '#B0246E';
const s = this.state;
const planList = [
{ id: 'date', label: 'Date' },
{ id: 'hike', label: 'Hike' },
{ id: 'night', label: 'Night out' },
{ id: 'ride', label: 'Long ride' }
];
const plans = planList.map((p) => ({
label: p.label,
pressed: s.plan === p.id ? 'true' : 'false',
bg: s.plan === p.id ? accent : '#561E4A',
fg: s.plan === p.id ? '#F6EEE2' : '#F6EEE2',
pick: () => this.setState({ plan: p.id })
}));
const times = [1, 2, 3, 4].map((h) => ({
label: h + 'h',
pressed: s.hours === h ? 'true' : 'false',
bg: s.hours === h ? accent : '#561E4A',
fg: s.hours === h ? '#F6EEE2' : '#F6EEE2',
pick: () => this.setState({ hours: h })
}));
const startMin = 20 * 60 + 30;
const total = startMin + s.hours * 60 + s.extra;
const hh = Math.floor(total / 60) % 24;
const mm = total % 60;
const h12 = ((hh + 11) % 12) + 1;
const backBy = h12 + ':' + (mm < 10 ? '0' + mm : mm) + (hh >= 12 ? ' pm' : ' am');
const planLabel = (planList.find((p) => p.id === s.plan) || planList[0]).label;
return {
accent,
highlight: this.props.highlight ?? '#F0C9D3',
plans,
times,
backBy,
planLabel,
isSetup: s.mode === 'setup',
isActive: s.mode === 'active',
isDone: s.mode === 'done',
start: () => this.setState({ mode: 'active', extra: 0 }),
extend: () => this.setState({ extra: s.extra + 30 }),
backSafe: () => this.setState({ mode: 'done' }),
reset: () => this.setState({ mode: 'setup', extra: 0 })
};
}
}

dcMount(Component);
</script>
</body>
</html>
